<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | ZR Business Platform</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>ZR Business Platform</h1>

        <p>Learn Commerce, Build Your Future</p>

        <input
        type="email"
        id="email"
        placeholder="Enter Email">

        <input
        type="password"
        id="password"
        placeholder="Enter Password">

        <button id="loginBtn">

            Login

        </button>

        <br><br>

        <a href="register.html">

            Create New Account

        </a>

        <br><br>

        <a href="#">

            Forgot Password?

        </a>

        <p id="message"></p>

    </div>

</div>

<script type="module" src="firebase.js?v=2"></script>
<script type="module" src="auth.js?v=2"></script>

</body>
</html>
